name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate HTML & assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List project structure
        run: |
          echo "## Repository layout" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find . -maxdepth 2 -not -path './.git*' | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check required pages exist
        run: |
          required=(
            index.html
            wiki.html
            introduction.html
            libraries-archives.html
            publishers.html
            scholarship.html
            book-compendium.html
            building-library.html
            conclusion.html
            martial_arts_industry_trends.html
            README.md
            LICENSE
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Missing required file: $f"
              missing=1
            else
              echo "OK $f"
            fi
          done
          exit $missing

      - name: Basic HTML sanity checks
        run: |
          set -e
          fail=0
          for f in *.html; do
            echo "Checking $f"
            if ! grep -q '<html' "$f"; then
              echo "::warning file=$f::No <html> tag found"
            fi
            if ! grep -qi '<title' "$f"; then
              echo "::warning file=$f::No <title> tag found"
              fail=1
            fi
            # Flag empty files
            if [ ! -s "$f" ]; then
              echo "::error file=$f::File is empty"
              fail=1
            fi
          done
          exit $fail

      - name: Inventory local assets
        run: |
          echo "## Local assets" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "| Path | Size |"
            echo "|------|------|"
            find . -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.gif' -o -name '*.svg' -o -name '*.webp' -o -name '*.ico' \) \
              -not -path './.git/*' | sort | while read -r f; do
              size=$(wc -c < "$f" | tr -d ' ')
              echo "| \`$f\` | ${size} bytes |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check internal HTML link targets
        run: |
          # Extract relative .html hrefs and verify targets exist
          python3 << 'PY'
          import re, pathlib, sys
          root = pathlib.Path('.')
          html_files = list(root.glob('*.html'))
          missing = []
          for path in html_files:
              text = path.read_text(encoding='utf-8', errors='replace')
              for href in re.findall(r'href=["\']([^"\'#]+)', text, flags=re.I):
                  if href.startswith(('http://', 'https://', 'mailto:', 'data:')):
                      continue
                  if href.startswith('#'):
                      continue
                  # strip query
                  target = href.split('?')[0]
                  candidate = (path.parent / target).resolve()
                  try:
                      candidate.relative_to(root.resolve())
                  except ValueError:
                      continue
                  if not candidate.exists():
                      missing.append(f"{path}: broken link -> {href}")
          if missing:
              for m in missing:
                  print(f"::warning::{m}")
              print(f"Found {len(missing)} potential broken internal links (warnings only)")
          else:
              print("No broken relative internal links detected")
          PY

  package-site:
    name: Package site artifact
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site tarball
        run: |
          mkdir -p artifacts/site
          cp *.html artifacts/site/
          for f in *.png *.jpg *.jpeg *.gif *.svg *.webp *.ico LICENSE README.md; do
            [ -f "$f" ] && cp "$f" artifacts/site/
          done
          for d in assets images screenshots docs css js media; do
            [ -d "$d" ] && cp -a "$d" artifacts/site/
          done
          (
            cd artifacts
            tar -czf martial-arts-site.tar.gz site
            zip -r martial-arts-site.zip site
          )
          ls -lah artifacts/

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: martial-arts-site
          path: |
            artifacts/martial-arts-site.tar.gz
            artifacts/martial-arts-site.zip
            artifacts/site
          retention-days: 14

  summarize:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [validate, package-site]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "### CI status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validate: **${{ needs.validate.result }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package site artifact: **${{ needs.package-site.result }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **martial-arts-site** artifact from this run for offline use or mirrors." >> "$GITHUB_STEP_SUMMARY"
