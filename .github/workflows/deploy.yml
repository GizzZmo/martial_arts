name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site package
        run: |
          mkdir -p _site
          # Static site: copy HTML, images, and other public assets
          cp -v *.html _site/ 2>/dev/null || true
          # Root images used by the site (e.g. README banner / page assets)
          for f in *.png *.jpg *.jpeg *.gif *.svg *.webp *.ico; do
            [ -f "$f" ] && cp -v "$f" _site/
          done
          # Optional directories if present
          for d in assets images screenshots docs css js media; do
            [ -d "$d" ] && cp -a "$d" _site/
          done
          # Keep license/readme available on the published site root
          [ -f LICENSE ] && cp LICENSE _site/
          [ -f README.md ] && cp README.md _site/
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
